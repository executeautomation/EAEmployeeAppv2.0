name: BearQ QA Run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      functional_area:
        description: "Functional area to run (leave blank for all regression tests)"
        required: false
        default: ""
      environment:
        description: "BearQ environment name (leave blank for workspace default)"
        required: false
        default: ""

jobs:
  bearq-tests:
    runs-on: ubuntu-latest
    env:
      BEARQ_API_KEY: ${{ secrets.BEARQ_API_KEY }}
      BEARQ_BASE_URL: https://api.bearq.smartbear.com
    steps:
      - name: Trigger BearQ tester run
        id: trigger
        run: |
          set -euo pipefail

          # Build request body based on inputs (functional area / environment optional)
          AREA="${{ github.event.inputs.functional_area }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"

          BODY=$(jq -n \
            --arg area "$AREA" \
            --arg env "$ENVIRONMENT" \
            '{agent:"tester", mode:"run"}
             + (if $area != "" then {functionalAreas: [$area]} else {} end)
             + (if $env != "" then {environment: $env} else {} end)')

          echo "Request body: $BODY"

          RESPONSE=$(curl -sf -X POST "$BEARQ_BASE_URL/tasks" \
            -H "Authorization: Bearer $BEARQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "$RESPONSE" | jq -r '.taskIds[]' > task_ids.txt
          echo "Created $(wc -l < task_ids.txt) task(s)"
          cat task_ids.txt

      - name: Stream tasks and gate on result
        id: gate
        run: |
          set -uo pipefail

          run_task() {
            local id="$1"
            local out
            out=$(curl -sN -H "Authorization: Bearer $BEARQ_API_KEY" \
              "$BEARQ_BASE_URL/tasks/$id/stream" \
              | awk '
                /^event: done$/    { getline; sub(/^data: /, ""); print "DONE " $0; exit }
                /^event: timeout$/ { getline; sub(/^data: /, ""); print "TIMEOUT " $0; exit }
              ')

            if [[ "$out" == TIMEOUT* ]]; then
              echo "$id STREAM_TIMEOUT ${out#TIMEOUT }"
              return 1
            fi

            local data="${out#DONE }"
            local status
            status=$(echo "$data" | jq -r '.testRunStatus // .status')
            echo "$id $status $data"
            [[ "$status" == "passed" || "$status" == "completed" ]]
          }

          FAILED=0
          declare -a PIDS=()
          declare -a IDS=()
          mkdir -p results

          while read -r ID; do
            [[ -z "$ID" ]] && continue
            run_task "$ID" > "results/$ID.txt" 2>&1 &
            PIDS+=($!)
            IDS+=("$ID")
          done < task_ids.txt

          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              FAILED=1
            fi
          done

          echo "## BearQ Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task ID | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for ID in "${IDS[@]}"; do
            LINE=$(cat "results/$ID.txt" 2>/dev/null || echo "$ID unknown")
            STATUS=$(echo "$LINE" | awk '{print $2}')
            echo "| $ID | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          done

          exit $FAILED

      - name: Upload BearQ result logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearq-results
          path: results/
